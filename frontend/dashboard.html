<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | QR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">QR<span>.SaaS</span></div>
            <div class="flex">
                <a href="links.html" class="btn btn-outline">My Links</a>
                <a href="create.html" class="btn btn-primary">Create New</a>
                <button class="btn btn-secondary" id="logoutBtn">Logout</button>
            </div>
        </header>

        <section class="mt-40">
            <h2>Welcome back, <span id="userName">User</span>!</h2>
            <div class="dashboard-grid">
                <div class="card stats-card">
                    <p>Total Scans</p>
                    <h3 id="totalScans">0</h3>
                </div>
                <div class="card stats-card">
                    <p>Active Links</p>
                    <h3 id="activeLinks">0</h3>
                </div>
                <div class="card stats-card">
                    <p>Unique Visitors</p>
                    <h3 id="uniqueVisitors">0</h3>
                </div>
            </div>
        </section>

        <section class="mt-40">
            <div class="flex justify-between">
                <h3>Recent Links</h3>
                <a href="links.html" style="color: var(--primary); text-decoration: none;">View All →</a>
            </div>
            <div id="recentLinksList" class="mt-40">
                <!-- Links will be loaded here -->
            </div>
        </section>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
